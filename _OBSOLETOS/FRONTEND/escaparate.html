<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escaparate · AURORA</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:'Segoe UI',Arial;}
  #vid{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;}
  #marca{position:absolute;left:0;right:0;bottom:28px;text-align:center;color:#F6CB45;
    font-size:2.2vw;font-weight:bold;text-shadow:0 2px 8px #000;letter-spacing:1px;opacity:.92;}
  #ayuda{position:absolute;top:14px;right:18px;color:#fff8;font-size:13px;}
  #start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:#1a0608;color:#F6CB45;cursor:pointer;z-index:5;}
  #start h1{font-size:3vw;margin:0 0 10px;} #start p{color:#fff;opacity:.8;font-size:1.2vw;}
  .hidden{display:none!important;}
</style>
</head>
<body>
  <div id="start" onclick="arrancar()">
    <h1>▶ Iniciar escaparate</h1>
    <p>Clic para pantalla completa · videos en bucle</p>
  </div>
  <video id="vid" muted playsinline></video>
  <div id="marca">ATF · Actualiza tus faros &nbsp;|&nbsp; Tel/WhatsApp 33 2968 9096</div>
  <div id="ayuda">Esc para salir · F para pantalla completa</div>
<script>
let lista=[], i=0;
const v=document.getElementById('vid');
async function cargar(){
  try{ const d=await (await fetch('/api/video/listar')).json();
    lista=(d.videos||[]).map(x=>'/videos/'+encodeURIComponent(x.nombre));
  }catch(e){ lista=[]; }
}
function siguiente(){
  if(!lista.length){ return; }
  v.src=lista[i % lista.length]; i++;
  v.play().catch(()=>{});
}
v.addEventListener('ended', siguiente);
v.addEventListener('error', ()=>{ setTimeout(siguiente,500); });
async function arrancar(){
  document.getElementById('start').classList.add('hidden');
  await cargar();
  // mezclar para variar
  for(let k=lista.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[lista[k],lista[j]]=[lista[j],lista[k]];}
  try{ await document.documentElement.requestFullscreen(); }catch(e){}
  siguiente();
}
document.addEventListener('keydown',e=>{
  if(e.key==='f'||e.key==='F'){ document.documentElement.requestFullscreen().catch(()=>{}); }
});
</script>
</body>
</html>
