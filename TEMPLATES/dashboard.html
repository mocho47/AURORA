<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURORA v1 Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        .status {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #eee;
        }

        .status:last-child {
            border-bottom: none;
        }

        .status-label {
            color: #555;
            font-weight: 500;
        }

        .status-value {
            color: #667eea;
            font-weight: bold;
            font-size: 1.2em;
        }

        .motors-list {
            list-style: none;
        }

        .motor-item {
            padding: 12px 0;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .motor-item:last-child {
            border-bottom: none;
        }

        .motor-name {
            color: #333;
            font-weight: 500;
        }

        .motor-sdk {
            background: #667eea;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
        }

        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-family: monospace;
            font-size: 1em;
            resize: vertical;
            min-height: 100px;
            margin-bottom: 12px;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: background 0.3s;
            width: 100%;
        }

        button:hover {
            background: #764ba2;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .response {
            margin-top: 15px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .response h3 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 0.9em;
        }

        .response-text {
            color: #333;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #e0e0e0;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
            border-left: 4px solid #c33;
        }

        .success {
            background: #efe;
            color: #3c3;
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
            border-left: 4px solid #3c3;
        }

        footer {
            text-align: center;
            color: white;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚡ AURORA v1</h1>
            <p class="subtitle">Intelligent Multi-Motor, Multi-SDK Orchestrator</p>
        </header>

        <div class="grid">
            <!-- Status Card -->
            <div class="card">
                <h2>📊 Estado</h2>
                <div id="status-content">
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>Cargando...</p>
                    </div>
                </div>
            </div>

            <!-- Motores Card -->
            <div class="card">
                <h2>🤖 Motores</h2>
                <div id="motores-content">
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>Descubriendo motores...</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Chat Card -->
        <div class="card">
            <h2>💬 Chat con AURORA</h2>
            <textarea id="mensaje-input" placeholder="Escribe tu mensaje aquí..."></textarea>
            <button onclick="enviarMensaje()">Enviar</button>
            <div id="response-container"></div>
        </div>

        <footer>
            <p>AURORA v1 • Powered by TEENS + NEXUS patterns • © 2026</p>
        </footer>
    </div>

    <script>
        const API_URL = 'http://localhost:8000';

        // Cargar status
        async function cargarStatus() {
            try {
                const response = await fetch(`${API_URL}/status`);
                const data = await response.json();

                document.getElementById('status-content').innerHTML = `
                    <div class="status">
                        <span class="status-label">Estado</span>
                        <span class="status-value">${data.status}</span>
                    </div>
                    <div class="status">
                        <span class="status-label">Motores Activos</span>
                        <span class="status-value">${data.motores_activos}/${data.motores_totales}</span>
                    </div>
                    <div class="status">
                        <span class="status-label">Timestamp</span>
                        <span class="status-value">${new Date(data.timestamp).toLocaleTimeString()}</span>
                    </div>
                `;
            } catch (e) {
                document.getElementById('status-content').innerHTML = `
                    <div class="error">Error: No se puede conectar a AURORA (${API_URL})</div>
                `;
            }
        }

        // Cargar motores
        async function cargarMotores() {
            try {
                const response = await fetch(`${API_URL}/motores`);
                const data = await response.json();

                const html = `
                    <ul class="motors-list">
                        ${data.motores.map(m => `
                            <li class="motor-item">
                                <span class="motor-name">${m.nombre}</span>
                                <span class="motor-sdk">${m.sdk_preferido}</span>
                            </li>
                        `).join('')}
                    </ul>
                `;

                document.getElementById('motores-content').innerHTML = html;
            } catch (e) {
                document.getElementById('motores-content').innerHTML = `
                    <div class="error">Error al cargar motores</div>
                `;
            }
        }

        // Enviar mensaje
        async function enviarMensaje() {
            const input = document.getElementById('mensaje-input');
            const mensaje = input.value.trim();

            if (!mensaje) return;

            const container = document.getElementById('response-container');
            container.innerHTML = '<div class="loading"><div class="spinner"></div><p>Procesando...</p></div>';

            try {
                const response = await fetch(`${API_URL}/procesar`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mensaje })
                });

                const data = await response.json();

                if (response.ok) {
                    container.innerHTML = `
                        <div class="response">
                            <h3>🎯 ${data.motor_id} (${data.sdk_usado})</h3>
                            <p class="response-text">${data.respuesta}</p>
                            <p style="font-size: 0.85em; color: #999; margin-top: 10px;">⏱️ ${data.tiempo_ms}ms</p>
                        </div>
                    `;
                } else {
                    container.innerHTML = `<div class="error">Error: ${data.detail}</div>`;
                }
            } catch (e) {
                container.innerHTML = `<div class="error">Error de conexión: ${e.message}</div>`;
            }
        }

        // Cargar al iniciar
        window.addEventListener('load', () => {
            cargarStatus();
            cargarMotores();
            setInterval(cargarStatus, 30000); // Actualizar cada 30s
        });

        // Enter para enviar
        document.getElementById('mensaje-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && e.ctrlKey) {
                enviarMensaje();
            }
        });
    </script>
</body>
</html>
